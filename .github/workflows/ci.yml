name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked

  node:
    name: Node services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: broker
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U broker -d broker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - name: Install broker dependencies
        working-directory: broker
        run: npm ci --no-audit --no-fund
      - name: Check broker syntax
        working-directory: broker
        run: npm run check
      - name: Test broker
        working-directory: broker
        run: npm test
      - name: Apply broker migrations twice
        working-directory: broker
        env:
          DATABASE_URL: postgresql://broker:broker-test-password@127.0.0.1:5432/broker
          BROKER_OIDC_AUDIENCE: ci-test
          BROKER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          npm run admin -- list
          npm run admin -- list
      - name: Check hosted service syntax
        run: |
          node --check hosted/server.mjs
          node --check hosted/dashboard.js
      - name: Test hosted service
        run: node --test hosted/server.test.mjs

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [rust, node]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Codex broker image
        run: docker build -f broker/Dockerfile -t second-opinion-broker:test .
      - name: Verify Codex CLI in broker image
        run: docker run --rm --entrypoint codex second-opinion-broker:test --version
      - name: Build hosted App image
        run: docker build -f hosted/Dockerfile -t second-opinion-hosted:test .
