name: Second-Opinion

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Optional: skip reviews when every changed file is documentation.
    # paths-ignore: &docs-only
    #   - "**/*.md"
    #   - "docs/**"
  push:
    branches:
      - "**"
    # paths-ignore: *docs-only

permissions:
  contents: read
  id-token: write # Required only when REVIEW_BROKER_URL selects Codex-broker.
  pull-requests: write
  checks: write # Required to annotate commits that have no pull request.

# Serializes direct Codex runs that share one rotating refresh-token chain.
# Broker and API-key deployments may choose a narrower per-PR group instead.
concurrency:
  group: second-opinion-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review pull request
        uses: wuisabel-gif/second-opinion@v0.4.0
        with:
          api-key: ${{ secrets.REVIEW_API_KEY }}
          provider: ${{ vars.REVIEW_BROKER_URL != '' && 'codex-broker' || vars.REVIEW_ENDPOINT != '' && 'webhook' || vars.REVIEW_PROVIDER || 'anthropic' }}
          model: ${{ vars.REVIEW_MODEL }}
          base-url: ${{ vars.REVIEW_BASE_URL }}
          endpoint: ${{ vars.REVIEW_ENDPOINT }}
          broker-url: ${{ vars.REVIEW_BROKER_URL }}
          broker-audience: ${{ vars.REVIEW_BROKER_AUDIENCE }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          auth-header: ${{ vars.REVIEW_AUTH_HEADER || 'Authorization' }}
          auth-scheme: ${{ vars.REVIEW_AUTH_SCHEME || 'Bearer' }}
          response-json-pointer: ${{ vars.REVIEW_RESPONSE_JSON_POINTER }}
          passes: ${{ vars.REVIEW_PASSES || '1' }}
          vote-threshold: ${{ vars.REVIEW_VOTE_THRESHOLD }}
          context-bytes: ${{ vars.REVIEW_CONTEXT_BYTES || '60000' }}
